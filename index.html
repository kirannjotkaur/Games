<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Game Menu</title>

  <style>
    :root {
      --bg: #020617;
      --card: #020617;
      --border: #1f2933;
      --accent: #38bdf8;
      --text: #e5e7eb;
      --muted: #9ca3af;
      --lock: #f59e0b;
    }

    * {
      box-sizing: border-box;
      font-family: "Segoe UI", system-ui, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at top, #020617, #000 60%);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 460px;
      padding: 24px;
      border-radius: 22px;
      background: linear-gradient(145deg, #020617, #020617);
      box-shadow: 0 0 40px rgba(56, 189, 248, 0.15);
      animation: fadeIn 0.8s ease;
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
      letter-spacing: 1px;
    }

    .menu {
      display: grid;
      gap: 16px;
    }

    .game-card {
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px;
      background: linear-gradient(145deg, #020617, #020617);
      position: relative;
      overflow: hidden;
      transition: 0.3s ease;
    }

    .game-card.playable {
      cursor: pointer;
    }

    .game-card.playable:hover {
      transform: translateY(-4px) scale(1.02);
      border-color: var(--accent);
      box-shadow: 0 10px 30px rgba(56, 189, 248, 0.25);
    }

    .game-card.locked {
      opacity: 0.75;
      filter: grayscale(20%);
    }

    .game-card.locked:hover {
      transform: translateY(-2px);
      border-color: #f59e0b;
      box-shadow: 0 8px 20px rgba(245, 158, 11, 0.25);
    }

    .game-title {
      font-size: 18px;
      font-weight: 600;
    }

    .game-desc {
      font-size: 14px;
      color: var(--muted);
      margin-top: 6px;
    }

    .badge {
      position: absolute;
      top: 12px;
      right: 12px;
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent);
      border: 1px solid rgba(56, 189, 248, 0.4);
    }

    .lock {
      position: absolute;
      bottom: 12px;
      right: 12px;
      font-size: 18px;
      opacity: 0.9;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>🎮 Game Menu</h1>

    <div class="menu">

      <!-- Playable Game -->
      <div class="game-card playable" onclick="location.href='guessprogress.html'">
        <div class="badge">PLAY</div>
        <div class="game-title">Guess Progress</div>
        <div class="game-desc">Click to start the guessing game</div>
      </div>

      <!-- Coming Soon Games -->
      <div class="game-card locked">
        <div class="lock">🔒</div>
        <div class="game-title">Tic Tac Toe</div>
        <div class="game-desc">Coming Soon</div>
      </div>

      <div class="game-card locked">
        <div class="lock">🔒</div>
        <div class="game-title">Memory Match</div>
        <div class="game-desc">Coming Soon</div>
      </div>

    </div>
  </div>

</body>
</html>
